name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify versions match tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          PLG=$(node -p "require('./plugin.json').version")
          echo "tag=$TAG  package.json=$PKG  plugin.json=$PLG"
          if [ "$PKG" != "$TAG" ] || [ "$PLG" != "$TAG" ]; then
            echo "::error::Version mismatch — tag is v$TAG but package.json=$PKG, plugin.json=$PLG. Bump both files to match the tag before releasing."
            exit 1
          fi

      - run: pnpm install
      - run: pnpm build

      - name: Package plugin
        run: |
          mkdir -p dist/GameRenamer
          cp plugin.json dist/GameRenamer/
          cp -r .millennium dist/GameRenamer/
          cd dist
          zip -r GameRenamer-${{ github.ref_name }}.zip GameRenamer/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/GameRenamer-${{ github.ref_name }}.zip
          generate_release_notes: true
